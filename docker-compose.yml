services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: karam
      POSTGRES_PASSWORD: karam
      POSTGRES_DB: karam
    ports:
      - "5432:5432"
    volumes:
      - karam_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karam -d karam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  karam_pg:
